<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MedSim-EMR — Epic Hyperspace Simulation</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Custom Epic Hyperspace-inspired dense styling */
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .epic-header { background-color: #1e293b; }
    .epic-subnav { background-color: #334155; }
    .epic-sidebar { background-color: #0f172a; }
    .tab-active { border-bottom: 3px solid #38bdf8; color: #38bdf8; font-weight: 600; }
    .table-dense th, .table-dense td { padding: 0.45rem 0.65rem; border-bottom: 1px solid #e2e8f0; }
    .table-dense th { background-color: #f8fafc; font-weight: 600; text-align: left; }
    .critical-val { color: #dc2626; font-weight: bold; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 h-screen flex flex-col text-xs">

  <header class="epic-header text-white flex items-center justify-between px-4 py-2 shrink-0 border-b border-slate-700">
    <div class="flex items-center space-x-3">
      <span class="bg-blue-600 text-white font-bold px-2 py-0.5 rounded text-sm tracking-wide">MedSim EMR</span>
      <span class="text-slate-300 font-medium">Epic Hyperspace — ED ASAP Module (Simulation Environment)</span>
    </div>
    <div class="flex items-center space-x-3">
      <button onclick="generateAIPatient()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-3 py-1 rounded shadow transition flex items-center space-x-1">
        <span>+ Generate AI ED Case</span>
      </button>
      <span class="bg-slate-700 px-2.5 py-1 rounded text-slate-200">Dept: EMERGENCY DEPT (ED-Main)</span>
    </div>
  </header>

  <div class="flex flex-1 overflow-hidden">

    <aside class="epic-sidebar text-slate-200 w-64 flex flex-col shrink-0 border-r border-slate-800">
      <div class="p-3 bg-slate-900 border-b border-slate-800 flex justify-between items-center">
        <span class="font-bold text-slate-100 uppercase tracking-wider">ED Track Board</span>
        <span id="patient-count" class="bg-blue-600 text-xs px-1.5 py-0.5 rounded-full">3</span>
      </div>
      <div id="patient-list" class="flex-1 overflow-y-auto divide-y divide-slate-800">
        </div>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden bg-white">

      <section id="patient-banner" class="bg-slate-900 text-white p-3 shadow-md shrink-0 border-b-2 border-blue-500">
        </section>

      <nav class="epic-subnav text-slate-300 flex space-x-6 px-4 shrink-0 border-b border-slate-700 select-none">
        <button onclick="switchTab('summary')" id="tab-summary" class="py-2.5 tab-active hover:text-white">Chart Summary</button>
        <button onclick="switchTab('labs')" id="tab-labs" class="py-2.5 hover:text-white">Labs & Imaging</button>
        <button onclick="switchTab('orders')" id="tab-orders" class="py-2.5 hover:text-white">Orders & Meds</button>
        <button onclick="switchTab('notes')" id="tab-notes" class="py-2.5 hover:text-white">Clinical Notes (SOAP)</button>
        <button onclick="switchTab('consults')" id="tab-consults" class="py-2.5 hover:text-white">Consults & Dispo</button>
      </nav>

      <div class="flex-1 overflow-y-auto p-4 bg-slate-50" id="tab-content">
        </div>

    </main>
  </div>

        notes: `**EMERGENCY DEPARTMENT ATTENDING CLINICAL NOTE**
**Patient:** O'Connor, Thomas (MRN: 4401928)
**Date/Time:** 07/29/2026 18:15 EDT

71yo M with COPD presents from nursing facility with 2 days of fever and purulent sputum. Caregivers noted confusion and lethargy today.

      {

        vitals: { bp: "78/42", hr: "135", rr: "34", spO2: "86% RA", temp: "36.9°C" },

    let currentPatientId = edCases[0].id;
    let currentTab = "summary";

    /**************************************************************
     * INTERFACE RENDERERS (EPIC HYPERSPACE SIMULATOR)
     **************************************************************/
    function init() {
      renderSidebar();
      selectPatient(currentPatientId);
    }

    function renderSidebar() {
      const listEl = document.getElementById("patient-list");
      document.getElementById("patient-count").textContent = edCases.length;
      listEl.innerHTML = edCases.map(p => `
        <div onclick="selectPatient('${p.id}')" class="p-3 cursor-pointer hover:bg-slate-800 transition ${p.id === currentPatientId ? 'bg-slate-800 border-l-4 border-blue-500' : ''}">
          <div class="flex justify-between items-start mb-1">
            <span class="font-bold text-white text-xs">${p.name}</span>
            <span class="${p.esiColor} text-white text-[10px] px-1.5 py-0.2 rounded font-semibold">${p.room}</span>
          </div>
          <div class="text-[11px] text-slate-400 flex justify-between">
            <span>MRN: ${p.mrn} | ${p.ageSex}</span>
            <span class="text-amber-400 font-medium">${p.esi.split(" ")[0]}</span>
          </div>
          <div class="text-[11px] text-slate-300 truncate mt-1">
            ${p.chiefComplaint}
          </div>
        </div>
      `).join("");
    }

    function selectPatient(id) {
      currentPatientId = id;
      renderSidebar();
      renderBanner();
      renderTabContent();
    }

    function renderBanner() {
      const p = edCases.find(c => c.id === currentPatientId);
      const bannerEl = document.getElementById("patient-banner");
      bannerEl.innerHTML = `
        <div class="flex flex-wrap items-center justify-between gap-2">
          <div class="flex items-center space-x-4">
            <div>
              <div class="text-base font-bold flex items-center space-x-2">

                <span class="text-xs bg-slate-700 px-1.5 py-0.5 rounded text-slate-200">${p.ageSex}</span>
                <span class="text-xs text-slate-300">DOB: ${p.dob}</span>
              </div>
              <div class="text-xs text-slate-300 flex space-x-3 mt-0.5">
                <span>MRN: <strong class="text-white">${p.mrn}</strong></span>
                <span>Loc: <strong class="text-blue-400">${p.room}</strong></span>
                <span>Code Status: <strong class="text-emerald-400">${p.codeStatus}</strong></span>
                <span>Isolation: <strong>${p.isolation}</strong></span>
              </div>
            </div>
          </div>
          <div class="flex items-center space-x-4">
            <div class="bg-red-950 border border-red-500 px-2.5 py-1 rounded">
              <span class="text-[10px] uppercase font-bold text-red-300 block">Allergies</span>
              <span class="text-xs font-semibold text-red-100">${p.allergies}</span>
            </div>
            <div class="${p.esiColor} text-white px-3 py-1.5 rounded font-bold text-center shadow">
              <span class="block text-[10px] uppercase tracking-wider">Acuity</span>
              <span>${p.esi}</span>
            </div>
          </div>
        </div>
      `;

    function switchTab(tabName) {
      currentTab = tabName;
      document.querySelectorAll("nav button").forEach(btn => btn.classList.remove("tab-active"));
      document.getElementById(`tab-${tabName}`).classList.add("tab-active");
      renderTabContent();
    }

    function renderTabContent() {
      const p = edCases.find(c => c.id === currentPatientId);
      const contentEl = document.getElementById("tab-content");

      if (currentTab === "summary") {
        contentEl.innerHTML = `
          <div class="grid grid-cols-3 gap-4">
            <div class="col-span-2 space-y-4">
              <div class="bg-white p-3.5 rounded shadow border border-slate-200">

                <p class="text-slate-800 text-sm font-semibold mb-1">${p.chiefComplaint}</p>
                <p class="text-slate-600 text-xs">Past Medical History: ${p.history}</p>

                    <span class="text-[10px] text-slate-500 block">RR</span>
                    <strong class="text-sm text-slate-900">${p.vitals.rr}</strong>
                  </div>
                  <div class="bg-slate-50 p-2 rounded border font-mono">
                    <span class="text-[10px] text-slate-500 block">SpO2</span>
                    <strong class="text-sm text-slate-900">${p.vitals.spO2}</strong>
                  </div>
                  <div class="bg-slate-50 p-2 rounded border font-mono">
                    <span class="text-[10px] text-slate-500 block">Temp</span>

                <ul class="list-disc list-inside space-y-1.5 text-slate-700">
                  ${p.meds.map(m => `<li>${m}</li>`).join("")}
                </ul>
              </div>
              <div class="bg-white p-3.5 rounded shadow border border-slate-200">
                <h3 class="font-bold text-slate-900 border-b pb-1.5 mb-2 uppercase text-xs tracking-wider">Consults & Disposition</h3>
                <p class="text-slate-800 text-xs font-medium">${p.consults}</p>
              </div>
            </div>
          </div>
        `;
      } else if (currentTab === "labs") {
        contentEl.innerHTML = `
          <div class="space-y-4">
            <div class="bg-white p-3.5 rounded shadow border border-slate-200">
              <h3 class="font-bold text-slate-900 border-b pb-1.5 mb-2 uppercase text-xs tracking-wider">Laboratory Results (Results Workbench)</h3>
              <table class="w-full table-dense">

                  <tr>
                    <th>Component Name</th>
                    <th>Value</th>

                    <th>Flag</th>

                  ${p.labs.map(l => `
                    <tr>
                      <td class="font-medium">${l.test}</td>
                      <td class="${l.flag.includes('CRITICAL') ? 'critical-val' : 'font-mono'}">${l.value}</td>
                      <td class="text-slate-500 font-mono">${l.ref}</td>
                      <td><span class="${l.flag.includes('CRITICAL') ? 'bg-red-100 text-red-800 font-bold px-1.5 py-0.5 rounded' : ''}">${l.flag}</span></td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            </div>
            <div class="bg-white p-3.5 rounded shadow border border-slate-200">
              <h3 class="font-bold text-slate-900 border-b pb-1.5 mb-2 uppercase text-xs tracking-wider">Radiology & EKG Reports</h3>
              <div class="space-y-3">
                ${p.imaging.map(i => `
                  <div class="border-l-4 border-blue-500 pl-3 py-1 bg-slate-50">
                    <div class="font-bold text-slate-800">${i.modality} <span class="text-slate-400 font-normal">@ ${i.time}</span></div>
                    <p class="text-slate-700 mt-1">${i.result}</p>
                  </div>
                `).join("")}
              </div>
            </div>
          </div>
        `;
      } else if (currentTab === "orders") {
        contentEl.innerHTML = `
          <div class="bg-white p-3.5 rounded shadow border border-slate-200">
            <div class="flex justify-between items-center border-b pb-2 mb-3">
              <h3 class="font-bold text-slate-900 uppercase text-xs tracking-wider">Active ED Orders & Medications</h3>
              <button class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-3 py-1 rounded text-xs shadow">+ Enter New Order (CPOE)</button>
            </div>
            <table class="w-full table-dense">
              <thead>
                <tr>
                  <th>Order Description</th>
                  <th>Status</th>
                  <th>Ordering Provider</th>
                </tr>
              </thead>
              <tbody>
                ${p.orders.map(o => `
                  <tr>
                    <td class="font-medium text-slate-900">${o.order}</td>
                    <td><span class="bg-blue-50 text-blue-800 font-semibold px-2 py-0.5 rounded">${o.status}</span></td>
                    <td class="text-slate-600">${o.provider}</td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        `;
      } else if (currentTab === "notes") {
        contentEl.innerHTML = `
          <div class="bg-white p-4 rounded shadow border border-slate-200">
            <div class="flex justify-between items-center border-b pb-2 mb-3">
              <h3 class="font-bold text-slate-900 uppercase text-xs tracking-wider">Physician Documentation (SOAP / SBAR)</h3>
              <span class="text-slate-400 text-xs">Attending Sign-off Completed</span>
            </div>
            <pre class="whitespace-pre-wrap font-sans text-sm text-slate-800 leading-relaxed bg-slate-50 p-4 rounded border">${p.notes}</pre>
          </div>
        `;
      } else if (currentTab === "consults") {
        contentEl.innerHTML = `
          <div class="bg-white p-4 rounded shadow border border-slate-200">
            <h3 class="font-bold text-slate-900 border-b pb-1.5 mb-2 uppercase text-xs tracking-wider">Consultation & Placement Status</h3>
            <div class="p-3 bg-blue-50 border border-blue-200 rounded">
              <p class="text-sm font-bold text-blue-950">Active Disposition Plan:</p>
              <p class="text-sm text-blue-900 mt-1">${p.consults}</p>
            </div>
          </div>
        `;
      }
    }

    /**************************************************************
     * AI PATIENT GENERATOR FUNCTION
     **************************************************************/
    function generateAIPatient() {
      const randomTemplate = aiSimulatedCases[Math.floor(Math.random() * aiSimulatedCases.length)];
      const newMRN = Math.floor(1000000 + Math.random() * 9000000).toString();
      const newBed = `ED-Bed ${Math.floor(1 + Math.random() * 20)}`;
      
      const newCase = {
        id: `mrn-${newMRN}`,
        name: randomTemplate.name,
        ageSex: randomTemplate.ageSex,
        dob: "06/14/1975",
        mrn: newMRN,
        room: newBed,
        esi: randomTemplate.esi,
        esiColor: randomTemplate.esiColor,
        codeStatus: "Full Code",
        allergies: "NKDA",
        isolation: "Standard",
        chiefComplaint: randomTemplate.chiefComplaint,
        history: randomTemplate.history,
        vitals: randomTemplate.vitals,
        labs: randomTemplate.labs,
        imaging: [{ modality: "CT / Radiograph Read", time: "Just now", result: randomTemplate.labs[0].value }],
        meds: randomTemplate.meds,
        orders: [{ order: "Continuous ECG & Vital Signs", status: "Active", provider: "Dr. A. Charvat (AI)" }],
        notes: `**AI GENERATED EMERGENCY DEPARTMENT CLINICAL CASE**
**Diagnosis:** ${randomTemplate.diagnosis}
**Chief Complaint:** ${randomTemplate.chiefComplaint}
**History:** ${randomTemplate.history}
**Clinical Course:** Patient arrived via EMS with acute distress. Immediate stabilization orders initiated. Specialty consult requested.`,
        consults: randomTemplate.consults
      };

      edCases.unshift(newCase);
      selectPatient(newCase.id);
    }

    // Initialize EMR Simulator on page load
    window.onload = init;
  </script>
</body>
